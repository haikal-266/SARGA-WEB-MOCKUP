<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="orgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="orgShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="20" y="20" width="600" height="360" rx="20" fill="url(#orgBg)" filter="url(#orgShadow)"/>

  <!-- Pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <rect x="35" y="35" width="570" height="330" rx="14" fill="none" stroke-dasharray="8 6"/>
  </g>

  <!-- Header Section -->
  <rect x="20" y="20" width="600" height="85" rx="20" fill="#022c22" opacity="0.4"/>
  <circle cx="65" cy="62" r="24" fill="#10b981"/>
  <text x="65" y="70" font-family="'Epilogue', sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#ffffff">S</text>
  
  <text x="105" y="54" font-family="'Epilogue', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="1">SARGA · INVENTARIS ORGANISASI</text>
  <text x="105" y="76" font-family="'Epilogue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" letter-spacing="0.5">KARTU TANDA ANGGOTA RESMI (KTA)</text>

  <!-- Card Content -->
  <g transform="translate(50, 130)">
    <!-- Photo Box -->
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <ellipse cx="60" cy="55" rx="28" ry="32" fill="#cbd5e1"/>
    <path d="M 15 140 C 15 100, 105 100, 105 140 Z" fill="#475569"/>
    <text x="60" y="170" font-family="'Epilogue', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">PAS FOTO</text>

    <!-- Details -->
    <g transform="translate(145, 10)" font-family="'Epilogue', 'Segoe UI', Arial, sans-serif" fill="#ffffff">
      <text x="0" y="15" font-size="11" font-weight="600" fill="#a7f3d0">NAMA LENGKAP</text>
      <text x="0" y="38" font-size="18" font-weight="800">AGUS SETIAWAN, S.T.</text>

      <text x="0" y="70" font-size="11" font-weight="600" fill="#a7f3d0">NOMOR ANGGOTA / ID</text>
      <text x="0" y="90" font-size="14" font-family="'Courier New', monospace" font-weight="700">KGI-2026-0891</text>

      <text x="0" y="120" font-size="11" font-weight="600" fill="#a7f3d0">ORGANISASI</text>
      <text x="0" y="140" font-size="14" font-weight="700">KOMUNITAS GRAHA INDAH</text>
    </g>

    <!-- QR Code / Chip Placeholder -->
    <g transform="translate(435, 10)">
      <rect width="90" height="90" rx="8" fill="#ffffff"/>
      <rect x="10" y="10" width="22" height="22" fill="#064e3b"/>
      <rect x="58" y="10" width="22" height="22" fill="#064e3b"/>
      <rect x="10" y="58" width="22" height="22" fill="#064e3b"/>
      <rect x="38" y="38" width="14" height="14" fill="#064e3b"/>
      <rect x="40" y="15" width="10" height="10" fill="#064e3b"/>
      <rect x="15" y="40" width="10" height="10" fill="#064e3b"/>
      <rect x="62" y="42" width="16" height="16" fill="#064e3b"/>
      <rect x="42" y="65" width="30" height="12" fill="#064e3b"/>
      <text x="45" y="115" font-family="'Epilogue', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">VERIFIED MEMBER</text>
    </g>
  </g>

  <!-- Footer Validity -->
  <g transform="translate(50, 335)" font-family="'Epilogue', sans-serif" font-size="11" fill="#e2e8f0">
    <text x="0" y="0">Berlaku Hingga: <tspan font-weight="700" fill="#ffffff">31 DESEMBER 2027</tspan></text>
    <text x="540" y="0" text-anchor="end" fill="#a7f3d0">Status Keanggotaan: <tspan font-weight="800" fill="#ffffff">PENGURUS / ANGGOTA</tspan></text>
  </g>
</svg>

